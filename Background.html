<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Sarkari Photo Studio - Fixed Version</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .flex { display: flex; gap: 20px; flex-wrap: wrap; }
        .editor { flex: 1; min-width: 300px; background: #333; height: 400px; }
        .controls { width: 300px; }
        #image { max-width: 100%; display: block; }
        .btn { width: 100%; padding: 10px; margin: 5px 0; cursor: pointer; font-weight: bold; border-radius: 5px; border: 1px solid #ccc; }
        .btn-primary { background: #d32f2f; color: white; border: none; }
        .kb-box { background: #fff3e0; padding: 10px; text-align: center; font-size: 20px; font-weight: bold; color: #e65100; border: 1px dashed #e65100; margin: 10px 0; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .color-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .color-circle { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #ddd; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:#d32f2f;">Sarkari Photo & Sign Editor</h2>
    <div class="flex">
        <div class="editor">
            <img id="image">
        </div>

        <div class="controls">
            <label><b>1. Photo Chunein</b></label>
            <input type="file" id="fileInput" accept="image/*">

            <label><b>2. Background Rang</b></label>
            <div class="color-group">
                <div class="color-circle" style="background:#ffffff" onclick="setBg('#ffffff')"></div>
                <div class="color-circle" style="background:#3b82f6" onclick="setBg('#3b82f6')"></div>
                <div class="color-circle" style="background:#e0e0e0" onclick="setBg('#e0e0e0')"></div>
                <input type="color" id="customColor" style="width:35px; padding:0;" oninput="setBg(this.value)">
            </div>

            <label><b>3. Naam aur Date</b></label>
            <input type="text" id="nameInput" placeholder="Student Name" oninput="process()">
            <input type="text" id="dateInput" placeholder="Date (DD/MM/YYYY)" oninput="process()">

            <label><b>4. Size Control (KB)</b></label>
            <input type="range" id="quality" min="0.1" max="1.0" step="0.01" value="0.8" oninput="process()">
            
            <div class="kb-box"><span id="kb">0</span> KB</div>

            <button class="btn btn-primary" onclick="download()">DOWNLOAD PHOTO</button>
        </div>
    </div>
    <canvas id="finalCanvas" style="display:none;"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script>
    let cropper;
    let selectedBg = '#ffffff';
    const fileInput = document.getElementById('fileInput');
    const image = document.getElementById('image');

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                image.src = event.target.result;
                if (cropper) cropper.destroy();
                cropper = new Cropper(image, {
                    aspectRatio: NaN,
                    viewMode: 1,
                    ready() { process(); },
                    cropend() { process(); }
                });
            };
            reader.readAsDataURL(file);
        }
    };

    function setBg(color) {
        selectedBg = color;
        process();
    }

    function process() {
        if (!cropper) return;

        const canvas = document.getElementById('finalCanvas');
        const ctx = canvas.getContext('2d');
        const q = parseFloat(document.getElementById('quality').value);
        const name = document.getElementById('nameInput').value.toUpperCase();
        const date = document.getElementById('dateInput').value;

        // Set dimensions (Passport size)
        canvas.width = 350;
        canvas.height = 450;

        // 1. Pehle Background bharein (Ye working hai!)
        ctx.fillStyle = selectedBg;
        ctx.fillRect(0, 0, 350, 450);

        // 2. Cropped Image draw karein
        const cropped = cropper.getCroppedCanvas();
        ctx.drawImage(cropped, 0, 0, 350, 450);

        // 3. Agar Name ya Date hai toh Strip banayein
        if (name || date) {
            const stripH = 90;
            ctx.fillStyle = "white";
            ctx.fillRect(0, 450 - stripH, 350, stripH);
            
            ctx.fillStyle = "black";
            ctx.textAlign = "center";
            ctx.font = "bold 22px Arial";
            ctx.fillText(name, 175, 450 - 50);
            ctx.font = "18px Arial";
            ctx.fillText(date, 175, 450 - 20);
        }

        // 4. KB calculate karein
        const dataUrl = canvas.toDataURL('image/jpeg', q);
        const kb = (dataUrl.length * 0.75 / 1024).toFixed(1);
        document.getElementById('kb').innerText = kb;
        return dataUrl;
    }

    function download() {
        const finalImg = process();
        if(!finalImg) return alert("Pehle photo load karein!");
        const link = document.createElement('a');
        link.href = finalImg;
        link.download = "sarkari_photo_ready.jpg";
        link.click();
    }
</script>
</body>
</html>
